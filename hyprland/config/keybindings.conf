# Live keybinds from the working desktop (paths use ~ so any user works).
gesture = 3, horizontal, workspace
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindr = $mainMod, Super_L, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle Start
bindr = $mainMod, Super_R, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle Start
bind = ALT, F4, exec, hyprctl dispatch killactive
bind = $mainMod, X, exec, hyprctl dispatch killactive
bind = $mainMod SHIFT_L, F, exec, hyprctl dispatch togglefloating
binde = $mainMod SHIFT_L, left, resizeactive, -50 0
binde = $mainMod SHIFT_L, right, resizeactive, 50 0
binde = $mainMod SHIFT_L, up, resizeactive, 0 -50
binde = $mainMod SHIFT_L, down, resizeactive, 0 50
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, F, exec, firefox
bind = $mainMod, E, exec, nautilus
bind = $mainMod, R, exec, bash ~/.config/hypr/scripts/reload.sh
bind = $mainMod, C, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle Clipboard
bind = $mainMod, P, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle GamingMode
bind = $mainMod SHIFT_L, S, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle Settings
bind = $mainMod, Q, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle DynamicMusic
bind = $mainMod, B, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle BatteryNotifications
bind = $mainMod, W, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle Wallpaper
bind = $mainMod, S, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle ClockWeather
bind = $mainMod, N, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle NetworkBluetooth
bind = $mainMod SHIFT_L, T, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle AgentCentre
bind = $mainMod, A, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle AgentCentre
bind = $mainMod, V, exec, quickshell -p ~/.config/arch-shell ipc call arch toggle Audio
bindl = , Caps_Lock, exec, sleep 0.1 && ~/.config/arch-shell/scripts/osd.sh caps
bindl = , XF86MonBrightnessDown, exec, ~/.config/arch-shell/scripts/osd.sh brightness-down
bindl = , XF86MonBrightnessUp, exec, ~/.config/arch-shell/scripts/osd.sh brightness-up
bindl = , Print, exec, flameshot gui
bindl = SHIFT_L, Print, exec, flameshot gui
bindl = $mainMod, Print, exec, flameshot gui
bindl = $mainMod SHIFT_L, Print, exec, flameshot gui
bindl = , XF86PowerOff, exec, bash ~/.config/hypr/scripts/lock.sh
bindel = $mainMod, L, exec, bash ~/.config/hypr/scripts/lock.sh
bindl = $mainMod, SPACE, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , xf86AudioMicMute, exec, ~/.config/arch-shell/scripts/osd.sh mic-mute
bindl = , xf86audiomute, exec, ~/.config/arch-shell/scripts/osd.sh volume-mute
bindel = , xf86audiolowervolume, exec, ~/.config/arch-shell/scripts/osd.sh volume-down
bindel = , xf86audioraisevolume, exec, ~/.config/arch-shell/scripts/osd.sh volume-up
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, TAB, exec, ~/.config/hypr/scripts/focus_next_monitor.sh
