# Acrylic blur for Arch Shell layers (Hyprland 0.45+ block syntax)
# no_anim is required: Hyprland's default layersIn fade interpolates the
# surface while blur is sampled, which stretches into a large light slab
# across the top of every flyout and a sharp rectangle past the corners.
layerrule {
    name = "arch-shell-bar-blur"
    match:namespace = ^(arch-shell-bar)$
    blur = on
    ignore_alpha = 0.05
    no_anim = on
}

layerrule {
    name = "arch-shell-popup-blur"
    match:namespace = ^(arch-shell-popup)$
    blur = on
    ignore_alpha = 0.05
    no_anim = on
}

layerrule {
    name = "arch-shell-notif-blur"
    match:namespace = ^(arch-shell-notif)$
    blur = on
    ignore_alpha = 0.05
    no_anim = on
}

layerrule {
    name = "arch-shell-osd-blur"
    match:namespace = ^(arch-shell-osd)$
    blur = on
    ignore_alpha = 0.05
    no_anim = on
}
