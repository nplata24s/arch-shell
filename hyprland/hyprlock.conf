# path is rewritten by install.sh to this user's home
general {
    disable_loading_bar = true
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = WALLPAPER_PATH
    blur_passes = 3
    blur_size = 4
    brightness = 0.7
}

input-field {
    monitor =
    size = 320, 48
    position = 0, -80
    halign = center
    valign = center
    rounding = 8
    outline_thickness = 1
    outer_color = rgb(26, 31, 40)
    inner_color = rgb(26, 31, 40)
    font_color = rgb(230, 237, 243)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = password
    fade_on_empty = false
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = rgb(230, 237, 243)
    position = 0, 80
    halign = center
    valign = center
}
