# Arch Shell — sample Hyprland config snippet
# Merged into your existing hyprland.conf by install.sh --enable

$mainMod = SUPER

# Arch Shell (disabled until: ./install.sh --enable)
# exec-once = quickshell -p ~/.config/arch-shell

# Keybinds generated from keybinds.json
source = ~/.config/arch-shell/hyprland/keybinds.conf

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}
